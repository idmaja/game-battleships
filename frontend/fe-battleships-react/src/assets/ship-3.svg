<svg
  width="96"
  height="32"
  viewBox="0 0 96 32"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- background transparan -->
  <rect x="0" y="0" width="96" height="32" fill="none" />

  <!-- hull utama -->
  <rect
    x="4"
    y="5"
    width="88"
    height="22"
    rx="10"
    ry="10"
    fill="#1f2933"
    stroke="#e5e7eb"
    stroke-width="1.5"
  />

  <!-- haluan (depan) -->
  <path
    d="M4 16 L0 12 L0 20 Z"
    fill="#1f2933"
    stroke="#e5e7eb"
    stroke-width="1.2"
  />

  <!-- buritan (belakang) -->
  <path
    d="M92 16 L96 12 L96 20 Z"
    fill="#1f2933"
    stroke="#e5e7eb"
    stroke-width="1.2"
  />

  <!-- dek dalam -->
  <rect
    x="10"
    y="8"
    width="76"
    height="16"
    rx="6"
    ry="6"
    fill="#374151"
  />

  <!-- tower tengah -->
  <rect x="36" y="9" width="24" height="14" rx="4" ry="4" fill="#4b5563" />
  <rect x="40" y="11" width="16" height="10" rx="3" ry="3" fill="#9ca3af" />

  <!-- meriam depan dan belakang -->
  <rect x="16" y="11" width="8" height="10" rx="2" ry="2" fill="#4b5563" />
  <rect x="72" y="11" width="8" height="10" rx="2" ry="2" fill="#4b5563" />

  <!-- jendela bulat -->
  <circle cx="32" cy="16" r="2" fill="#e5e7eb" />
  <circle cx="48" cy="16" r="2" fill="#e5e7eb" />
  <circle cx="64" cy="16" r="2" fill="#e5e7eb" />
</svg>
