<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Battleship</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 16px;
        }

        .section {
            margin-bottom: 20px;
        }

        #messagesLog, #attackResult {
            border: 1px solid #ccc;
            padding: 8px;
            min-height: 60px;
            white-space: pre-line;
            max-height: 200px;
            overflow-y: auto;
        }

        #scoresList {
            list-style: none;
            padding-left: 0;
        }
    </style>
</head>
<body>
    <h1>Battleship</h1>

    <div class="section">
        <label for="coordinateInput">Coordinate (contoh A1, B3):</label>
        <input id="coordinateInput" type="text" placeholder="A1">
        <button id="attackBtn">Attack</button>
    </div>

    <div class="section">
        <h2>Hasil Attack <span id="playerName" style="font-weight: bold;"></span></h2>
        <div id="attackResult"></div>
    </div>

    <div class="section">
        <h2>Scores</h2>
        <ul id="scoresList"></ul>
    </div>

    <div class="section">
        <h2>Notifikasi sistem (SignalR)</h2>
        <div id="messagesLog"></div>
    </div>

    <!-- SignalR client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
        // Jika front end dan API satu origin, cukup kosongkan baseUrl
        const baseUrl = "http://localhost:5069";
        // Sesuaikan path ini dengan route controller kamu
        const attackUrl = baseUrl + "/api/v1/battleships/attack";

        const coordinateInput = document.getElementById("coordinateInput");
        const playerName = document.getElementById("playerName");
        const attackBtn = document.getElementById("attackBtn");
        const attackResultDiv = document.getElementById("attackResult");
        const scoresList = document.getElementById("scoresList");
        const messagesLog = document.getElementById("messagesLog");

        // 1. Hubungkan ke SignalR hub
        const connection = new signalR.HubConnectionBuilder()
            .withUrl(baseUrl + "/gameHub")
            .build();

        // Handler untuk pesan dari server
        connection.on("ReceiveMessage", function (message) {
            messagesLog.innerHTML += message + "<br><br>";
            messagesLog.scrollTop = messagesLog.scrollHeight;
        });

        connection.start()
            .catch(function (err) {
                console.error("SignalR connection error", err);
            });

        // 2. Fungsi untuk memanggil endpoint Attack
        async function sendAttack() {
            const coordinate = coordinateInput.value.trim();
            if (!coordinate) {
                alert("Isi coordinate dulu");
                return;
            }

            const payload = {
                coordinate: coordinate
            };

            try {
                const response = await fetch(attackUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.json();
                    attackResultDiv.textContent = "Error: " + errorText.message;
                    return;
                }

                const data = await response.json();

                renderAttackResult(data);
                renderScores(data.scores);

                const playerKeys = Object.keys(data.scores);
                const playerHuman = playerKeys[0];
                playerName.innerHTML = `${playerHuman}`;

            } catch (e) {
                console.error(e);
                attackResultDiv.textContent = "Request gagal dikirim";
            }
        }

        function renderAttackResult(data) {
            const lines = [];
            lines.push("Result: " + (data.isHit ? "Hit" : "Miss"));
            lines.push("Game over: " + (data.isGameOver ? "Yes" : "No"));
            lines.push("Message: " + data.message);

            attackResultDiv.textContent = lines.join("\n");
        }

        function renderScores(scores) {
            scoresList.innerHTML = "";
            if (!scores) {
                return;
            }

            Object.keys(scores).forEach(function (playerName) {
                const li = document.createElement("li");
                li.textContent = playerName + ": " + scores[playerName];
                scoresList.appendChild(li);
            });
        }

        // 3. Event button
        attackBtn.addEventListener("click", function () {
            sendAttack();
        });

        // Tekan Enter di input juga kirim attack
        coordinateInput.addEventListener("keyup", function (e) {
            if (e.key === "Enter") {
                sendAttack();
            }
        });
    </script>
</body>
</html>
